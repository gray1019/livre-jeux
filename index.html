<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murder on the Midnight Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#d9d4c7;--dim:#8d97a3;--blood:#a31621;--gold:#d4a84b;--navy:#08111f;--box:rgba(6,12,24,.88)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'IM Fell English',Georgia,serif;font-size:19px;line-height:1.7;
background:radial-gradient(ellipse at 50% 0%,#12274a 0%,#0a1630 38%,#03060d 80%) fixed;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;left:-50%;width:200%;height:40%;pointer-events:none;
background:radial-gradient(ellipse,rgba(140,160,190,.10),transparent 65%);animation:fog 40s linear infinite}
body:before{bottom:0}body:after{bottom:15%;animation-duration:60s;animation-direction:reverse}
@keyframes fog{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.top{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;position:relative;z-index:2}
.lang button{font:700 .85rem 'Cinzel',serif;color:var(--dim);background:transparent;border:1px solid #2b3a52;padding:6px 14px;border-radius:4px;cursor:pointer}
.lang button.on{color:#fff;border-color:var(--blood);background:rgba(163,22,33,.35)}
main{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:10px 18px 60px}
.box{background:var(--box);border:1px solid #2a3b57;border-top:3px solid var(--blood);border-radius:6px;padding:30px 28px 28px;
box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.8),0 0 50px rgba(163,22,33,.15)}
.hero{text-align:center;padding:20px 0 6px}
h1{font:700 clamp(2rem,6.5vw,3.3rem)/1.15 'Cinzel Decorative',serif;margin:10px 0 14px;color:#eee8d8;text-shadow:0 0 18px rgba(163,22,33,.7),0 2px 0 #000;letter-spacing:.03em}
.sub{color:var(--dim);font-style:italic;margin:0 auto 26px;max-width:460px}
h2{font:700 1.35rem 'Cinzel',serif;color:var(--gold);margin:14px 0 10px;letter-spacing:.04em}
p{margin:0 0 14px}
.frame{position:relative;width:100%;aspect-ratio:16/9;margin:0 0 20px;border:1px solid #2f4466;border-radius:4px;overflow:hidden;background:linear-gradient(160deg,#0d1b33,#050912);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 6px 24px rgba(0,0,0,.6)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame.has:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 70px rgba(0,0,0,.75);pointer-events:none}
.frame .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font:500 .75rem 'Cinzel',serif;letter-spacing:.1em;color:var(--dim);opacity:.7}
.pic{display:block;margin:0 auto;width:150px;height:90px;color:var(--gold);filter:drop-shadow(0 0 8px rgba(212,168,75,.35))}
.pic.d{color:var(--blood);filter:drop-shadow(0 0 10px rgba(163,22,33,.7))}
.pic.w{color:#7fcf9c}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opts button,.go{font:inherit;text-align:left;color:var(--ink);background:rgba(20,34,58,.6);border:1px solid #2f4466;border-left:3px solid var(--blood);
padding:12px 16px;border-radius:4px;cursor:pointer;transition:.18s}
.opts button:hover,.go:hover{background:rgba(163,22,33,.28);border-color:var(--blood);transform:translateX(4px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.go{display:inline-block;text-align:center;font:700 1rem 'Cinzel',serif;padding:14px 38px;letter-spacing:.08em}
.tag{display:inline-block;font:700 .9rem 'Cinzel',serif;padding:3px 14px;border:1px solid;border-radius:20px;margin:6px 0}
.tag.d{color:#ff6b73}.tag.w{color:#7fcf9c}.tag.m{color:var(--gold)}
.end{text-align:center;font:700 1.1rem 'Cinzel',serif;letter-spacing:.3em;color:var(--dim);margin-top:20px}
input{display:block;width:100%;max-width:340px;margin:0 auto 12px;font:inherit;font-size:1.05rem;text-align:center;color:var(--ink);background:rgba(4,9,18,.8);border:1px solid #2f4466;border-bottom:2px solid var(--blood);border-radius:4px;padding:11px 14px}
input:focus-visible{outline:2px solid var(--gold)}
.gen{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.gen button,.menu button,.mb{font:500 .9rem 'Cinzel',serif;color:var(--dim);background:transparent;border:1px solid #2b3a52;padding:9px 18px;border-radius:4px;cursor:pointer;transition:.18s}
.gen button.on{color:#fff;border-color:var(--blood);background:rgba(163,22,33,.35)}
.gen button:hover,.menu button:hover,.mb:hover{color:#fff;border-color:var(--blood)}
.menu{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.bar{margin-bottom:14px}.mb{padding:6px 12px}
.nm{color:var(--gold);font-style:italic}.dim{color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:16px 0}
.card{border:1px solid #2f4466;border-radius:4px;padding:12px;background:rgba(20,34,58,.5);display:flex;flex-direction:column;gap:4px;min-height:96px}
.card b{font:500 .8rem 'Cinzel',serif;color:var(--dim)}.card em{font-size:.82rem}
.card.d{border-color:var(--blood)}.card.d em{color:#ff6b73}.card.w{border-color:#4f9d6f}.card.w em{color:#7fcf9c}.card.m{border-color:var(--gold)}.card.m em{color:var(--gold)}
.card.lock{opacity:.55;border-style:dashed}.card.lock span{font-size:1.3rem;letter-spacing:.3em;color:var(--dim)}
.tag.s{color:#b48cff}.card.s{border-color:#8a63d2}.card.s em{color:#b48cff}.pic.s{color:#b48cff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:5;background:#000;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:4px;font:500 .9rem 'Cinzel',serif;animation:in .4s ease}
.top input{display:inline-block;width:90px;max-width:90px;margin:0;padding:0;border:0;background:transparent;accent-color:#a31621;align-self:center}
.lang{align-items:center}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#snow i{position:absolute;top:-10px;width:4px;height:4px;border-radius:50%;background:#dfe8f5;animation:fall linear infinite}
@keyframes fall{to{transform:translate(70px,108vh)}}
h1{animation:flick 8s infinite}
@keyframes flick{0%,91%,100%{opacity:1}92%{opacity:.35}93%{opacity:1}95%{opacity:.55}96%{opacity:1}}
.rail{height:52px;overflow:hidden;position:relative;margin:4px 0 16px;border-bottom:2px dashed #2b3a52}
.rail svg{position:absolute;left:0;top:0;width:110px;height:52px;color:var(--gold);opacity:.85;animation:drive 12s linear infinite}
@keyframes drive{from{transform:translateX(-130px)}to{transform:translateX(760px)}}
.frame img{animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.frame.d{animation:shake .6s}
.frame.d:before{content:"";position:absolute;inset:0;background:#a31621;opacity:0;z-index:2;animation:flash .9s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
.frame.w{animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 0 6px rgba(212,168,75,.2)}to{box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 0 28px rgba(212,168,75,.55)}}
.opts button small{color:var(--dim);font-size:.82rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#0a1224;padding:8px;border-radius:6px;max-width:380px;margin:12px auto;touch-action:none}
.t{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;font:700 1.5rem 'Cinzel',serif;color:#fff}
.info{display:flex;justify-content:space-between;max-width:380px;margin:0 auto;color:var(--gold);font-family:'Cinzel',serif}
.pad{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}.pad .mb{padding:10px 18px;font-size:1.1rem}
.tw{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap}.tw canvas{border:1px solid #2f4466;background:#050a14;max-width:100%}
.ti{color:var(--gold);font-family:'Cinzel',serif;display:flex;flex-direction:column;gap:8px}
.cb{display:grid;grid-template-columns:repeat(8,1fr);max-width:440px;margin:12px auto;border:2px solid var(--blood)}
.sq{aspect-ratio:1;border:0;padding:0;font-size:clamp(22px,7vw,40px);line-height:1;cursor:pointer}
.sq.l{background:#33496f}.sq.d{background:#14233f}.sq.sel{outline:3px solid var(--gold);outline-offset:-3px}.sq.mv{box-shadow:inset 0 0 0 4px rgba(212,168,75,.75)}
.wp{color:#f4ecd6;text-shadow:0 0 3px #000}.bp{color:#0a0f1a;text-shadow:0 0 2px rgba(255,255,255,.5)}
.cm{text-align:center;color:var(--gold);font-family:'Cinzel',serif;min-height:1.7em}
.vista{margin:2px 0 18px}.vista svg{width:100%;height:auto;display:block}
.sc{animation:scr 30s linear infinite}.s1{animation-duration:46s}.s2{animation-duration:16s}
@keyframes scr{to{transform:translateX(-640px)}}
.slp{animation:sleep .22s linear infinite}@keyframes sleep{to{transform:translateX(-24px)}}
.trn{animation:bob .32s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(1.2px)}}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.rod{animation:rod .5s ease-in-out infinite alternate}@keyframes rod{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.wl{animation:wlk 3s ease-in-out infinite alternate}@keyframes wlk{from{opacity:.5}to{opacity:1}}
.smoke circle{fill:#aeb8c8;opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 3.2s ease-out infinite}
@keyframes puff{0%{opacity:.7;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-90px,-40px) scale(3.2)}}
.beam{animation:bflick 4s infinite}@keyframes bflick{0%,93%,100%{opacity:1}95%{opacity:.5}}
h1{animation:flick 8s infinite,gl 4s ease-in-out infinite alternate}
@keyframes gl{from{text-shadow:0 0 12px rgba(163,22,33,.5),0 2px 0 #000}to{text-shadow:0 0 32px rgba(163,22,33,.95),0 2px 0 #000}}
#storm{position:fixed;inset:0;pointer-events:none;z-index:3;background:#bcd0ff;opacity:0;animation:storm 17s infinite}
@keyframes storm{0%,90%,100%{opacity:0}91%{opacity:.16}92%{opacity:0}93%{opacity:.1}95%{opacity:0}}
.box{animation:bpulse 5s ease-in-out infinite alternate}
@keyframes bpulse{from{box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.8),0 0 30px rgba(163,22,33,.1)}to{box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.8),0 0 60px rgba(163,22,33,.32)}}
.lamp{position:absolute;top:-8px;right:34px;width:2px;height:40px;background:#3a4a63;transform-origin:top;animation:swing 4s ease-in-out infinite alternate;z-index:2}
.lamp:after{content:"";position:absolute;left:-8px;top:36px;width:18px;height:24px;border-radius:4px 4px 8px 8px;background:#e0a43a;box-shadow:0 0 22px 8px rgba(224,164,58,.55);animation:lf 2.3s infinite}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes lf{0%,100%{opacity:1}45%{opacity:.8}50%{opacity:.55}55%{opacity:.9}}
h2{animation:trk 1s ease both}@keyframes trk{from{letter-spacing:.25em;opacity:0}to{letter-spacing:.04em;opacity:1}}
.opts button{animation:slide .5s backwards}@keyframes slide{from{opacity:0;transform:translateX(-18px)}}
.opts button:nth-child(2){animation-delay:.1s}.opts button:nth-child(3){animation-delay:.2s}.opts button:nth-child(4){animation-delay:.3s}
.tag.d{animation:throb 1.4s ease-in-out infinite}@keyframes throb{50%{box-shadow:0 0 14px rgba(255,107,115,.7)}}
.card.lock{animation:shim 3s ease-in-out infinite}@keyframes shim{50%{opacity:.8}}
.cka{position:relative;display:flex;justify-content:center;margin:14px 0;min-height:150px}
.ckb{width:200px;height:140px;background:radial-gradient(circle,rgba(163,22,33,.3),transparent 70%);border:1px solid #2f4466;border-radius:18px;cursor:pointer;color:var(--gold);transition:transform .08s}
.ckb:active{transform:scale(.92)}.ckb svg{width:150px;height:90px}
.pop{position:absolute;top:30%;pointer-events:none;color:#ffd27a;font:700 1.1rem 'Cinzel',serif;animation:rise .9s ease-out forwards}@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.gold{position:absolute;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle,#ffe9a8,#d4a84b);color:#5a3b00;font-size:1.3rem;box-shadow:0 0 18px #d4a84b;animation:gp 1s ease-in-out infinite alternate}@keyframes gp{from{transform:scale(.9)}to{transform:scale(1.15)}}
.up{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left}.up.no{opacity:.45}
.fade{animation:in .6s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* N:[icon, type(''|d|w|m), [title EN, FR], [text EN, FR], [[choice EN, choice FR, goto], ...]] */
var S={
1:["train","",["Compartment 7","Compartiment 7"],["A scream cuts through the rattle of the wheels at midnight. You are a passenger on the Midnight Express, and a retired detective. You reach compartment 7 first: Lord Harlan Voss, the richest man aboard, lies slumped across his desk, very dead. His reading lamp is still burning. The train will not stop for two hours.","Un cri déchire le fracas des roues à minuit. Vous êtes passager du Midnight Express, et détective à la retraite. Vous arrivez le premier au compartiment 7 : Lord Harlan Voss, l'homme le plus riche du train, gît effondré sur son bureau, bien mort. Sa lampe de lecture brûle encore. Le train ne s'arrêtera pas avant deux heures."],
 [["Examine the body","Examiner le corps",2],["Find the conductor and question him","Trouver le contrôleur et l'interroger",3],["Lock down the corridor so no one leaves","Bloquer le couloir pour que personne ne parte",4],["Question the passengers in the sleeping car","Interroger les passagers du wagon-lit",31]]],
2:["desk","",["The Body","Le corps"],["Voss was struck once from behind with something heavy. In his clenched hand is a torn ticket corner, punched with a star-shaped hole. The window is cracked open, and the desk drawers have been pulled out in a hurry. Whoever did this was searching for something, or wanted it to look that way.","Voss a été frappé une seule fois par derrière avec un objet lourd. Dans sa main crispée, un coin de billet déchiré, poinçonné d'une étoile. La fenêtre est entrouverte et les tiroirs du bureau ont été arrachés à la hâte. Le meurtrier cherchait quelque chose, ou voulait le faire croire."],
 [["Search the desk","Fouiller le bureau",5],["Inspect the open window","Examiner la fenêtre ouverte",6]]],
3:["key","",["The Conductor","Le contrôleur"],["Conductor Pell arrives pale and sweating, his cap crooked. He swears he was in the dining car all night and that he saw Dr. Roth slip out of Voss's cabin an hour ago. His key ring jingles with every breath. He answers every question a little too quickly.","Le contrôleur Pell arrive, pâle et en sueur, la casquette de travers. Il jure avoir passé la nuit au wagon-restaurant et avoir vu le docteur Roth sortir de la cabine de Voss il y a une heure. Son trousseau tinte à chaque souffle. Il répond à chaque question un peu trop vite."],
 [["Believe him and go speak to Dr. Roth","Le croire et aller parler au docteur Roth",7],["Ask to see his master key","Lui demander de voir son passe",8]]],
4:["shadow","",["The Dark Corridor","Le couloir sombre"],["You bar both ends of the corridor. Moments later the lights flicker and die. Something moves near the luggage door, a shape pressed against the wall, breathing fast and low.","Vous barrez les deux bouts du couloir. Peu après, les lumières vacillent et s'éteignent. Quelque chose bouge près de la porte des bagages, une forme plaquée contre le mur, qui respire vite et bas."],
 [["Step toward the shape and confront it","Avancer vers la forme et l'affronter",9],["Back into compartment 7 and shut the door","Reculer dans le compartiment 7 et fermer la porte",2]]],
5:["book","",["The Ledger","Le registre"],["Behind a false panel you find a leather ledger. Voss collected monthly payments from several people on this train. One entry stands out: sums beside the initial P, unpaid for three months. Beneath it, in his cramped hand: Tell the railway. Ruin him.","Derrière un faux panneau, vous trouvez un registre en cuir. Voss percevait des paiements mensuels de plusieurs personnes du train. Une ligne attire l'œil : des sommes à côté de l'initiale P, impayées depuis trois mois. En dessous, de sa petite écriture : Prévenir la compagnie. Le ruiner."],
 [["Take the ledger to Mrs. Calloway, Voss's partner","Porter le registre à Mme Calloway, l'associée de Voss",10],["Show it to Teo Brandt, his secretary","Le montrer à Teo Brandt, son secrétaire",21],["Go straight to Conductor Pell","Aller directement voir le contrôleur Pell",11]]],
6:["window","",["The Window","La fenêtre"],["Snow whips in from the dark. No footprints on the sill, but a scrap of dark blue uniform wool is caught on the latch. Ahead you hear the low roar of a tunnel. Something glints on the outer wall, just out of reach.","La neige s'engouffre dans la nuit. Aucune trace sur le rebord, mais un fil de laine bleu foncé, d'uniforme, est accroché au loquet. Devant vous, le grondement sourd d'un tunnel. Quelque chose brille sur la paroi extérieure, juste hors de portée."],
 [["Lean out to see what is hanging outside","Se pencher dehors pour voir ce qui pend",12],["Pocket the thread, close the window, search the desk","Empocher le fil, fermer la fenêtre, fouiller le bureau",5]]],
7:["cup","",["Dr. Roth's Tea","Le thé du docteur Roth"],["Dr. Elena Roth receives you with unnerving calm. A steaming teapot sits on her table, and she pours two cups without asking. \u00ab You look cold. Sit. Drink. Then ask me anything. \u00bb Her eyes never leave yours.","Le docteur Elena Roth vous reçoit avec un calme troublant. Une théière fumante trône sur sa table, et elle sert deux tasses sans rien demander. \u00ab Vous avez froid. Asseyez-vous. Buvez. Puis posez-moi vos questions. \u00bb Ses yeux ne quittent pas les vôtres."],
 [["Drink the tea and relax","Boire le thé et se détendre",13],["Decline and press her about her argument with Voss","Refuser et la presser sur sa dispute avec Voss",14]]],
8:["key","",["The Master Key","Le passe"],["Pell slowly unhooks his ring. Eleven keys, and a twelfth empty loop. \u00ab Lost it yesterday, \u00bb he mutters, far too quickly. Then he shoves you aside and bolts toward the rear of the train.","Pell décroche lentement son trousseau. Onze clés, et un douzième anneau vide. \u00ab Perdu hier, \u00bb marmonne-t-il, bien trop vite. Puis il vous bouscule et file vers l'arrière du train."],
 [["Grab him and demand he empty his pockets","L'attraper et exiger qu'il vide ses poches",11],["Follow quietly and see where he goes","Le suivre discrètement pour voir où il va",15]]],
9:["skull","d",["The Shape in the Dark","La forme dans le noir"],["You step forward and reach out. Steel flashes. The blade finds you before your eyes adjust, and the last thing you hear is the train, rattling on into the night, utterly indifferent.","Vous avancez et tendez la main. L'acier brille. La lame vous trouve avant que vos yeux ne s'habituent, et le dernier bruit que vous entendez est celui du train, qui roule dans la nuit, parfaitement indifférent."],[]],
10:["door","",["Mrs. Calloway","Madame Calloway"],["Ines Calloway reads the ledger with cold, stiff fingers. \u00ab He owned half of everyone on this train. Including me. But I was at my table all night. \u00bb She does not blink. Behind her, the door of her own compartment stands slightly ajar.","Ines Calloway lit le registre de ses doigts raides et glacés. \u00ab Il possédait la moitié des gens de ce train. Moi comprise. Mais j'étais à ma table toute la nuit. \u00bb Elle ne cille pas. Derrière elle, la porte de son compartiment est entrouverte."],
 [["Go with her to the dining car","L'accompagner au wagon-restaurant",16],["Slip into her compartment to look around","Se glisser dans son compartiment pour fouiller",22],["Ask her about her feud with Voss","L'interroger sur sa querelle avec Voss",41]]],
11:["train","",["The Chase","La poursuite"],["Pell panics. He shoves past you and sprints through the swaying cars, upending luggage. At the rear platform he spins around, trapped, one hand on the door that opens onto the roaring dark. The emergency brake is within reach, and so is Pell.","Pell panique. Il vous bouscule et court à travers les wagons qui tanguent, renversant les valises. Sur la plateforme arrière, il se retourne, acculé, une main sur la porte qui donne sur la nuit rugissante. Le frein d'urgence est à portée de main, tout comme Pell."],
 [["Pull the emergency brake","Tirer le frein d'urgence",17],["Tackle him on the open platform","Le plaquer sur la plateforme ouverte",18]]],
12:["tunnel","d",["The Tunnel","Le tunnel"],["You lean out into the freezing wind, searching the side of the carriage. You never see the tunnel mouth rush up. The stone wall takes you at sixty miles an hour.","Vous vous penchez dans le vent glacial, scrutant le flanc du wagon. Vous ne voyez jamais l'entrée du tunnel surgir. Le mur de pierre vous happe à cent kilomètres à l'heure."],[]],
13:["cup","d",["The Poisoned Cup","La tasse empoisonnée"],["The tea is warm and slightly bitter. By the second sip your fingers go numb. Dr. Roth watches without moving. \u00ab Voss was not the only one who knew too much, \u00bb she says softly, as the room tilts and goes dark.","Le thé est chaud et légèrement amer. À la deuxième gorgée, vos doigts s'engourdissent. Le docteur Roth vous regarde sans bouger. \u00ab Voss n'était pas le seul à en savoir trop, \u00bb dit-elle doucement, tandis que la pièce bascule dans le noir."],[]],
14:["cup","",["Dr. Roth's Secret","Le secret du docteur Roth"],["Roth sets down the pot. \u00ab We argued because he threatened to expose a mistake I made years ago. But I did not kill him. Around two, I saw Pell leave cabin 7 carrying a bag, a star-punch in his hand. \u00bb She holds your gaze. \u00ab I think you already suspect him. \u00bb","Roth repose la théière. \u00ab Nous nous sommes disputés parce qu'il menaçait de révéler une erreur de mon passé. Mais je ne l'ai pas tué. Vers deux heures, j'ai vu Pell sortir de la cabine 7 avec un sac, un poinçon en forme d'étoile à la main. \u00bb Elle soutient votre regard. \u00ab Je crois que vous le soupçonnez déjà. \u00bb"],
 [["Search the luggage car for the bag","Fouiller le wagon à bagages",15],["Gather everyone in the dining car","Réunir tout le monde au wagon-restaurant",16],["Ask her about the mistake she made","L'interroger sur son erreur passée",46]]],
15:["bag","",["The Luggage Car","Le wagon à bagages"],["Between trunks and mailbags you find a canvas bag: gloves stiff with dried blood, a heavy brass lamp base, and a star-shaped ticket punch. A voice behind you says, \u00ab You really shouldn't have opened that. \u00bb Pell stands in the doorway, a revolver trembling in his hand.","Entre les malles et les sacs postaux, vous trouvez un sac de toile : des gants raidis de sang séché, un lourd pied de lampe en laiton et un poinçon en forme d'étoile. Une voix derrière vous dit : \u00ab Vous n'auriez pas dû l'ouvrir. \u00bb Pell se tient dans l'encadrement, un revolver tremblant à la main."],
 [["Bluff: the police are waiting at the next station","Bluffer : la police attend à la prochaine gare",17],["Lunge for the gun","Se jeter sur l'arme",18],["Duck behind the trunks and wait","Se cacher derrière les malles et attendre",19]]],
16:["train","",["The Dining Car","Le wagon-restaurant"],["Everyone sits stiffly under the amber lamps: Dr. Roth, Mrs. Calloway, the young secretary Teo Brandt, and Conductor Pell, one hand in his pocket. The coffee goes cold untouched. All eyes turn to you. It is time to name a killer.","Tous sont assis, raides, sous les lampes ambrées : le docteur Roth, Mme Calloway, le jeune secrétaire Teo Brandt et le contrôleur Pell, une main dans la poche. Le café refroidit, intact. Tous les regards se tournent vers vous. Il est temps de nommer un meurtrier."],
 [["Accuse Conductor Pell","Accuser le contrôleur Pell",17],["Accuse Mrs. Calloway","Accuser Mme Calloway",20],["Accuse Dr. Roth","Accuser le docteur Roth",20],["Accuse Teo Brandt","Accuser Teo Brandt",20]]],
17:["badge","w",["Justice at the Next Station","Justice à la prochaine gare"],["Pell's nerve breaks. He confesses: Voss had squeezed him for years over a forged-ticket racket and threatened to end his career, so in a rage he struck him down and staged a theft. At dawn the train stops, and police lead him away through the snow. You step onto the platform as the sun rises, tired but certain.","Pell craque. Il avoue : Voss le tenait depuis des années à cause d'un trafic de faux billets et menaçait de briser sa carrière. Dans sa rage, il l'a frappé et a maquillé un vol. À l'aube, le train s'arrête et la police l'emmène dans la neige. Vous descendez sur le quai au lever du soleil, fatigué mais certain."],[]],
18:["skull","d",["A Struggle in the Dark","Une lutte dans le noir"],["You throw yourself at Pell. The gun goes off, and a searing pain blooms in your chest. You slide to the floor as the door slams and the train carries the killer away from you. Nobody finds you until morning.","Vous vous jetez sur Pell. Le coup part, et une douleur brûlante s'épanouit dans votre poitrine. Vous glissez au sol tandis que la porte claque et que le train emporte le meurtrier loin de vous. Personne ne vous trouve avant le matin."],[]],
19:["bag","m",["The One Who Got Away","Celui qui a filé"],["You hold your breath as Pell searches, then gives up, grabs the bag and slips away. When the train slows at the next station, you stagger out and tell the police everything. They find the abandoned bag, but Pell is gone. You survive, and you will never forget his face.","Vous retenez votre souffle pendant que Pell cherche, puis renonce, saisit le sac et s'éclipse. Quand le train ralentit à la gare suivante, vous titubez dehors et racontez tout à la police. Ils retrouvent le sac abandonné, mais Pell a disparu. Vous survivez, et n'oublierez jamais son visage."],[]],
20:["door","m",["The Wrong Suspect","Le mauvais suspect"],["You name your suspect with confidence, and the room goes silent. Then the evidence fails to fit, and your accusation unravels in public. The innocent person never forgives you, and while everyone argues, Pell quietly slips off at a dark siding. The case is never solved.","Vous nommez votre suspect avec assurance, et le silence se fait. Puis les preuves ne collent pas, et votre accusation s'effondre devant tous. L'innocent ne vous le pardonnera jamais, et pendant que tout le monde se querelle, Pell s'esquive sur une voie de garage obscure. L'affaire ne sera jamais résolue."],[]],
21:["book","",["Teo Brandt","Teo Brandt"],["Teo is gray-faced and shaking when you show him the ledger. \u00ab I only typed his letters. I never knew what was in them. \u00bb His hand drifts to his jacket, where the corner of an envelope sticks out. When you reach for it, he flinches as if burned.","Teo est blême et tremblant quand vous lui montrez le registre. \u00ab Je ne faisais que taper ses lettres. Je ne savais pas ce qu'elles contenaient. \u00bb Sa main glisse vers sa veste, d'où dépasse le coin d'une enveloppe. Quand vous tendez le bras, il recule comme brûlé."],
 [["Calmly demand the letter","Exiger calmement la lettre",22],["He bolts out the door: give chase","Il s'enfuit : le poursuivre",23]]],
22:["book","",["The Letter","La lettre"],["The envelope holds a draft letter in Voss's handwriting, addressed to the railway board and dated yesterday. It names Conductor Pell as head of a forged-ticket scheme and demands his arrest at the end of this journey. You now hold a motive, in writing, for the one man who can open any door on this train.","L'enveloppe contient un brouillon de lettre de la main de Voss, adressé au conseil de la compagnie et daté d'hier. Il y nomme le contrôleur Pell chef d'un trafic de faux billets et exige son arrestation à l'arrivée. Vous tenez désormais un mobile, écrit, pour le seul homme qui peut ouvrir toutes les portes du train."],
 [["Carry it to the dining car and gather everyone","L'apporter au wagon-restaurant et réunir tout le monde",16],["Go find Pell in the staff quarters","Aller trouver Pell dans les quartiers du personnel",26]]],
23:["tunnel","",["The Roof","Le toit"],["Teo flings open the end door and scrambles up an iron ladder onto the roof of the moving train. Snow and smoke whip around him as he crouches by the chimney vent. You climb after him, wind tearing at your sleeves.","Teo ouvre la porte du bout et grimpe à une échelle de fer jusqu'au toit du train en marche. Neige et fumée tourbillonnent autour de lui, accroupi près de la cheminée. Vous le suivez, le vent arrachant vos manches."],
 [["Keep climbing toward him along the icy roof","Continuer vers lui sur le toit verglacé",24],["Stop and call out to him gently","S'arrêter et l'appeler doucement",25]]],
24:["skull","d",["The Icy Roof","Le toit verglacé"],["You lunge across the roof for Teo's arm just as the carriage lurches around a curve. Your boots slide on the ice. For a second you are weightless, and then the dark embankment rises to meet you.","Vous vous élancez vers le bras de Teo au moment où le wagon tangue dans une courbe. Vos bottes glissent sur la glace. Une seconde, vous ne pesez plus rien, puis le talus obscur se rue à votre rencontre."],[]],
25:["key","",["Teo's Confession","L'aveu de Teo"],["Teo slowly climbs down with you, sobbing. \u00ab I ran because I saw him. At two in the morning Pell opened cabin 7 with his master key, a ticket punch in his hand. I was too scared to speak. \u00bb He presses a small brass key into your palm. \u00ab It opens the staff quarters. Be careful. \u00bb","Teo redescend lentement avec vous, en sanglots. \u00ab J'ai fui parce que je l'ai vu. À deux heures du matin, Pell a ouvert la cabine 7 avec son passe, un poinçon à la main. J'avais trop peur pour parler. \u00bb Il glisse une petite clé de laiton dans votre paume. \u00ab Elle ouvre les quartiers du personnel. Soyez prudent. \u00bb"],
 [["Go to Pell's quarters alone","Aller seul aux quartiers de Pell",26],["Search the luggage car for the bag first","Fouiller d'abord le wagon à bagages",15]]],
26:["door","",["Pell's Quarters","Les quartiers de Pell"],["The staff quarters are cramped and smell of damp wool. In the wardrobe hangs a dark blue uniform jacket with a torn cuff, and the scrap from the window fits it perfectly. Under the bunk is a tin box of forged tickets. Footsteps stop outside, and a key turns in the lock.","Les quartiers du personnel sont exigus et sentent la laine humide. Dans l'armoire pend une veste d'uniforme bleu foncé au poignet déchiré, et le fil de la fenêtre s'y accorde parfaitement. Sous la couchette, une boîte de fer-blanc pleine de faux billets. Des pas s'arrêtent dehors, et une clé tourne dans la serrure."],
 [["Step out and confront Pell with the torn jacket","Se dresser face à Pell avec la veste déchirée",27],["Hide inside the wardrobe","Se cacher dans l'armoire",28]]],
27:["key","",["The Standoff","L'impasse"],["Pell freezes in the doorway, staring at the jacket in your hands. Then his shoulders drop. \u00ab I could make this very easy, \u00bb he says, sliding a thick envelope of cash from his coat. \u00ab Enough to retire twice over. Take it, and nobody ever needs to know. \u00bb","Pell se fige sur le seuil, les yeux rivés sur la veste que vous tenez. Puis ses épaules s'affaissent. \u00ab Je peux vous faciliter la vie, \u00bb dit-il en sortant de son manteau une épaisse enveloppe de billets. \u00ab De quoi prendre deux fois votre retraite. Prenez-la, et personne n'en saura rien. \u00bb"],
 [["Refuse and place him under citizen's arrest","Refuser et l'arrêter en citoyen",17],["Take the envelope","Prendre l'enveloppe",29]]],
28:["door","",["Inside the Wardrobe","Dans l'armoire"],["Through the crack in the door you watch Pell pace and mutter, burning papers in the little stove. The wardrobe smells of camphor and old smoke. He stops, tilts his head, and looks straight at the wardrobe. A floorboard has creaked under your foot.","Par la fente de la porte, vous voyez Pell faire les cent pas en marmonnant, brûlant des papiers dans le petit poêle. L'armoire sent le camphre et la fumée froide. Il s'arrête, penche la tête, et regarde droit vers l'armoire. Une latte du plancher a craqué sous votre pied."],
 [["Burst out and confront him","Surgir et l'affronter",27],["Stay completely still","Rester parfaitement immobile",30]]],
29:["badge","m",["Blood Money","L'argent du sang"],["You take the envelope. Pell smiles, relieved, and the next morning he vanishes at the first station. You live comfortably for years, but you never sleep well, and you never stop hearing Voss's scream. A detective who can be bought is no detective at all.","Vous prenez l'enveloppe. Pell sourit, soulagé, et le lendemain il disparaît à la première gare. Vous vivez confortablement des années, mais vous ne dormez plus bien et n'oubliez jamais le cri de Voss. Un détective qu'on peut acheter n'est plus un détective."],[]],
30:["skull","d",["Found","Découvert"],["The wardrobe door swings open. Pell stands there, the heavy brass lamp base in his hand. \u00ab I really wish you hadn't been so clever, {T} {n}, \u00bb he says. The blow is quick, and the train carries on through the snow without ever slowing down.","La porte de l'armoire s'ouvre à la volée. Pell est là, le lourd pied de lampe en laiton à la main. \u00ab J'aurais vraiment préféré que vous soyez moins malin, {T} {n}, \u00bb dit-il. Le coup est rapide, et le train poursuit sa route dans la neige sans jamais ralentir."],[]],
31:["door","",["The Sleeping Car","Le wagon-lit"],["Curtained berths line the narrow sleeping car, each hiding someone pretending to be asleep. Major Arthur Hale, a gray-mustached veteran, steps out in his dressing gown. «Detective {n}, around two I heard a key turn in Voss's door, then a man humming, very softly. I'm a light sleeper.» Behind him a frightened porter whispers that the stoker, Dunn, saw something strange near the engine.","Des couchettes à rideaux bordent l'étroit wagon-lit, chacune cachant quelqu'un qui fait semblant de dormir. Le major Arthur Hale, un vétéran à la moustache grise, sort en robe de chambre. «Détective {n}, vers deux heures j'ai entendu une clé tourner dans la porte de Voss, puis un homme fredonner, très doucement. J'ai le sommeil léger.» Derrière lui, un porteur effrayé murmure que le chauffeur, Dunn, a vu quelque chose d'étrange près de la locomotive."],
 [["Ask the Major to let you look inside his compartment","Demander au major de fouiller son compartiment",32],["Follow the porter's whisper to the engine room","Suivre le murmure du porteur jusqu'à la salle des machines",33]]],
32:["key","",["The Major's Secret","Le secret du major"],["Inside you find a service revolver in an open case and a framed photograph of a young soldier. A shadow falls across the doorway: Hale has followed you in, one hand resting on the case. «Careful,» he says quietly. «Some things in this room are none of your business.»","À l'intérieur, un revolver d'ordonnance dans un étui ouvert et la photographie encadrée d'un jeune soldat. Une ombre tombe sur le seuil : Hale vous a suivi, une main posée sur l'étui. «Prudence,» dit-il doucement. «Certaines choses ici ne vous regardent pas.»"],
 [["Tell him the truth about the case","Lui dire la vérité sur l'enquête",34],["Snatch the revolver before he can","Saisir le revolver avant lui",35]]],
33:["train","",["The Engine Room","La salle des machines"],["Heat hammers you as the furnace door swings open. Dunn the stoker wipes soot from his face. «Pell came by at ten past two with a canvas bag. Wanted me to burn it. I said no, and he took it away again.» Behind him a ladder climbs into the coal tender, where something pale glints among the black heaps.","La chaleur vous écrase quand la porte du foyer s'ouvre. Dunn, le chauffeur, essuie la suie de son visage. «Pell est passé à deux heures dix avec un sac de toile. Il voulait que je le brûle. J'ai refusé, et il l'a repris.» Derrière lui, une échelle monte vers le tender à charbon, où quelque chose de pâle brille parmi les tas noirs."],
 [["Ask Dunn to come with you as a witness","Demander à Dunn de vous suivre comme témoin",37],["Climb into the coal tender to find the glint","Grimper dans le tender pour trouver l'éclat",36]]],
34:["badge","",["An Unexpected Ally","Un allié inattendu"],["You lay it all out: the ledger, the star-punch, the thread of blue wool. Hale listens, then relaxes. «I'm no murderer, {n}. If it's Pell, I'll stand beside you.» He hands you the revolver, grip first. «Your call.»","Vous exposez tout : le registre, le poinçon en étoile, le fil de laine bleue. Hale écoute, puis se détend. «Je ne suis pas un meurtrier, {n}. Si c'est Pell, je serai à vos côtés.» Il vous tend le revolver, crosse en avant. «À vous de décider.»"],
 [["Go to Pell together with the Major","Aller voir Pell avec le major",39],["Take the revolver and search the luggage car alone","Prendre le revolver et fouiller seul le wagon à bagages",15]]],
35:["skull","d",["Reflex","Réflexe"],["Your hand closes on the revolver, but Hale's old instincts are faster than your fingers. A single sharp crack fills the little room. The last thing you see is the photograph of the young soldier, lying face-down on the floor.","Votre main se referme sur le revolver, mais les vieux réflexes de Hale sont plus rapides que vos doigts. Une détonation sèche emplit la petite pièce. La dernière chose que vous voyez est la photographie du jeune soldat, face contre le sol."],[]],
36:["skull","d",["Buried in Coal","Enseveli sous le charbon"],["You haul yourself into the tender and crawl toward the glint. The train lurches over a rail joint, and the black mountain beneath you gives way. Coal pours over your shoulders, then your head. Nobody hears you over the roar of the engine.","Vous vous hissez dans le tender et rampez vers l'éclat. Le train tressaute sur un joint de rail, et la montagne noire cède sous vous. Le charbon se déverse sur vos épaules, puis sur votre tête. Personne ne vous entend dans le vacarme de la machine."],[]],
37:["key","",["The Stoker's Word","La parole du chauffeur"],["Dunn nods and wipes his hands. «I'll say what I saw. But hurry. Last I looked, Pell was heading for the rear of the train with a wrench.» The train thunders on, and every second counts.","Dunn hoche la tête et s'essuie les mains. «Je dirai ce que j'ai vu. Mais dépêchez-vous. La dernière fois, Pell filait vers l'arrière du train avec une clé à molette.» Le train file dans un fracas, et chaque seconde compte."],
 [["Race to the rear platform with Dunn","Courir vers la plateforme arrière avec Dunn",38],["Take Dunn to the dining car to tell everyone","Emmener Dunn au wagon-restaurant pour tout raconter",16]]],
38:["train","",["The Coupling","L'attelage"],["On the rear platform Pell kneels over the coupling pin, wrench in fist, the pin already half loose. Once it slips, the last cars will drift away with every witness inside, and he will walk free into the night. Dunn grips his shovel beside you.","Sur la plateforme arrière, Pell est agenouillé sur la broche d'attelage, une clé à la main, la broche déjà à moitié desserrée. Quand elle lâchera, les derniers wagons dériveront avec tous les témoins, et il disparaîtra libre dans la nuit. Dunn serre sa pelle à côté de vous."],
 [["Pull the emergency brake","Tirer le frein d'urgence",17],["Rush Pell with Dunn at your side","Foncer sur Pell avec Dunn à vos côtés",40]]],
39:["key","",["The Major's Aim","La visée du major"],["You and Hale find Pell in the corridor outside the staff quarters, his own revolver pointed at the Major's chest. «Back off, old man,» Pell hisses. Hale does not flinch. The Major's revolver, in your hand, is cold and heavy.","Vous et Hale trouvez Pell dans le couloir devant les quartiers du personnel, son propre revolver braqué sur la poitrine du major. «Reculez, vieil homme,» siffle Pell. Hale ne bronche pas. Le revolver du major, dans votre main, est froid et lourd."],
 [["Raise the revolver and fire at his gun hand","Lever le revolver et tirer sur sa main armée",40],["Lower your voice and try to talk him down","Baisser la voix et tenter de le raisonner",17]]],
40:["badge","w",["A Train Full of Witnesses","Un train de témoins"],["In the chaos, one hand finds a wrench, another a revolver, and Pell goes down hard. Passengers spill from their berths as the train rolls on, still whole. By dawn the police have a confession, and half the carriage has a story to tell. It took more than one person to catch this killer, and you are glad you were not alone.","Dans le chaos, une main saisit une clé, une autre un revolver, et Pell s'effondre. Les passagers jaillissent de leurs couchettes tandis que le train roule, toujours entier. À l'aube, la police a des aveux, et la moitié du wagon a une histoire à raconter. Il a fallu plus d'une personne pour arrêter ce meurtrier, et vous êtes heureux de ne pas avoir été seul."],[]],
41:["door","",["Calloway's Confession","L'aveu de Calloway"],["Ines Calloway sets her cup down very carefully. «Voss forced my signature on the mine papers years ago. I hated him, {n}, but I did not kill him.» She presses a small iron key into your hand. «His second ledger is locked in the safe of the mail car. He trusted no one with it. Not even Pell.»","Ines Calloway pose sa tasse avec un soin extrême. «Voss m'a forcé la main pour signer les actes de la mine, il y a des années. Je le haïssais, {n}, mais je ne l'ai pas tué.» Elle glisse une petite clé de fer dans votre main. «Son second registre est enfermé dans le coffre du wagon postal. Il ne se fiait à personne. Pas même à Pell.»"],
 [["Go to the mail car","Aller au wagon postal",42],["Doubt her and check her compartment","Douter d'elle et fouiller son compartiment",22]]],
42:["bag","",["The Mail Car","Le wagon postal"],["Mail sacks sag like sleeping animals in the swaying dark. At the far end stands a squat iron safe with a brass dial. You could open it with the key, or by brute force: a crowbar leans against a sack within reach.","Les sacs postaux s'affaissent comme des bêtes endormies dans l'obscurité tanguante. Au fond se dresse un coffre de fer trapu à cadran de laiton. Vous pourriez l'ouvrir avec la clé, ou de force : un pied-de-biche est appuyé contre un sac, à portée de main."],
 [["Open the safe with Calloway's key","Ouvrir le coffre avec la clé de Calloway",43],["Force the safe with the crowbar","Forcer le coffre au pied-de-biche",44]]],
43:["book","",["The Second Ledger","Le second registre"],["Inside lies a thin black ledger. Voss's notes expose Conductor Pell as Percival Lunt, a fraudster wanted in three countries, and record every payment he extorted. On a shelf beside the safe sits a telegraph key, wired to the line along the track.","À l'intérieur repose un mince registre noir. Les notes de Voss dévoilent le contrôleur Pell comme Percival Lunt, un escroc recherché dans trois pays, et consignent chaque paiement qu'il a extorqué. Sur une étagère à côté du coffre, un manipulateur télégraphique est relié à la ligne le long de la voie."],
 [["Confront everyone in the dining car","Confronter tout le monde au wagon-restaurant",16],["Send a telegram to the next station","Envoyer un télégramme à la prochaine gare",45],["Take the ledger to Major Hale","Porter le registre au major Hale",34]]],
44:["skull","d",["The Noisy Way","La manière bruyante"],["The crowbar slips with a ringing clang that echoes down the whole train. You barely turn before the mail car door slides shut and a key clicks. «Voss never could keep his secrets quiet either,» says Pell. The lamp goes out.","Le pied-de-biche glisse dans un fracas qui résonne dans tout le train. Vous avez à peine le temps de vous retourner que la porte du wagon postal se referme et qu'une clé cliquette. «Voss non plus n'a jamais su garder ses secrets discrets,» dit Pell. La lampe s'éteint."],[]],
45:["key","",["The Telegraph","Le télégraphe"],["You tap out the message with shaking fingers: Lunt aboard Midnight Express, murder, hold the train. The wire hums, then the reply clicks back: «Police waiting at Harrow Junction. Keep him aboard.» Forty minutes remain, and the lamps flicker as the train begins to slow.","Vous tapez le message d'une main tremblante : Lunt à bord du Midnight Express, meurtre, retenez le train. Le fil bourdonne, puis la réponse cliquette : «Police à Harrow Junction. Gardez-le à bord.» Il reste quarante minutes, et les lampes vacillent tandis que le train commence à ralentir."],
 [["Go to the dining car and keep everyone calm","Aller au wagon-restaurant et calmer tout le monde",49],["Meet the police on the platform when the train stops","Attendre la police sur le quai à l'arrêt du train",17]]],
46:["cup","",["Roth's Mistake","L'erreur de Roth"],["Roth stares at her folded hands. «Years ago I signed a death certificate for a man who was still breathing. Voss paid me to, and kept it as leverage.» She slides a small leather medical bag toward you. «There is a sedative in there, strong enough to put a man to sleep in minutes. Use it if you must.»","Roth fixe ses mains jointes. «Il y a des années, j'ai signé le certificat de décès d'un homme qui respirait encore. Voss me l'avait payé, et il s'en servait contre moi.» Elle fait glisser vers vous une petite sacoche de cuir. «Il y a un sédatif là-dedans, assez fort pour endormir un homme en quelques minutes. Servez-vous-en si vous le devez.»"],
 [["Take the vial","Prendre la fiole",47],["Refuse and return the bag","Refuser et rendre la sacoche",16]]],
47:["cup","",["The Vial","La fiole"],["The glass vial is cold in your pocket. In the dining car Pell is serving coffee with steady hands, and he has not noticed you watching. A tray of cups waits on the counter, one marked by a chipped saucer. It is his.","La fiole de verre est froide dans votre poche. Au wagon-restaurant, Pell sert le café d'une main ferme, sans vous avoir remarqué. Un plateau de tasses attend sur le comptoir, l'une marquée d'une soucoupe ébréchée. C'est la sienne."],
 [["Slip the sedative into Pell's cup","Verser le sédatif dans la tasse de Pell",48],["Keep the vial hidden and accuse him openly","Garder la fiole cachée et l'accuser ouvertement",17]]],
48:["cup","m",["The Wrong Cup","La mauvaise tasse"],["Pell sees your hand move and, smiling, swaps his cup with the one beside it. Teo Brandt drains it in one gulp, and the room tilts around him. In the panic nobody believes your story, and Pell slips away in the confusion. Teo wakes at dawn, but the case never closes.","Pell voit votre main bouger et, en souriant, échange sa tasse avec celle d'à côté. Teo Brandt la vide d'un trait, et la pièce bascule autour de lui. Dans la panique, personne ne croit votre histoire, et Pell s'esquive dans la confusion. Teo se réveille à l'aube, mais l'affaire ne sera jamais close."],[]],
49:["badge","w",["Read Aloud","Lecture à voix haute"],["In the dining car you read Voss's second ledger aloud, and the telegram reply with it. Pell's real name drops into the silence like a stone. Hale and Dunn block the doors, Roth and Calloway stand together, and Teo finds his courage. At Harrow Junction the police take Percival Lunt away, and the train applauds you as dawn comes up.","Au wagon-restaurant, vous lisez à voix haute le second registre de Voss, puis la réponse du télégramme. Le vrai nom de Pell tombe dans le silence comme une pierre. Hale et Dunn bloquent les portes, Roth et Calloway se tiennent côte à côte, et Teo trouve son courage. À Harrow Junction, la police emmène Percival Lunt, et le train vous applaudit tandis que l'aube se lève."],[]],
50:["badge","s",["Curtain Call","Rideau"],["The Midnight Express rolls into a grand theater. The lights rise, the snow turns out to be paper, and Lord Voss sits up on his desk. «Was that a wrap?» he asks. Pell hands the revolver to the props table, Roth pours real tea, and the whole cast takes a bow. You step forward, {n}, and the audience, which is you, applauds. Thank you for playing.","Le Midnight Express entre dans un grand théâtre. Les lumières se rallument, la neige était du papier, et Lord Voss se redresse sur son bureau. «C'était la bonne prise ?» demande-t-il. Pell rend le revolver à l'accessoiriste, Roth sert du vrai thé, et toute la troupe salue. Vous avancez, {n}, et le public, c'est vous, applaudit. Merci d'avoir joué."],[]]

function mf(n){return 440*Math.pow(2,(n-69)/12)}
function moodFor(){if(view=='story'){var t=S[cur][1];return t=='d'?'death':t=='w'?'win':t=='m'?'mixed':t=='s'?'secret':TENSE.indexOf(cur)>-1?'tense':'mystery'}return view.charAt(0)=='g'?'game':'mystery'}
function setMood(m){want=m;if(AC)applyMood()}
function synthStart(){
 if(AC)return;var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 AC=new C();if(AC.resume)AC.resume();MG=AC.createGain();MG.gain.value=MON?MV:0;MG.connect(AC.destination);
 DL=AC.createDelay(1);DL.delayTime.value=.46;var fb=AC.createGain();fb.gain.value=.38;DL.connect(fb);fb.connect(DL);DL.connect(MG);
 NB=AC.createBuffer(1,AC.sampleRate*.08,AC.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
 applyMood();tick();
}
function applyMood(){
 if(!AC||curM==want)return;curM=want;var m=MS[want],t=AC.currentTime;
 dn.forEach(function(o){o.g.gain.setTargetAtTime(0,t,1.2);o.o.forEach(function(x){x.stop(t+7)})});dn=[];
 m.dr.forEach(function(iv,i){
  var g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420+i*120;g.gain.value=0;g.gain.setTargetAtTime(.06,t,2);
  var os=[0,1].map(function(k){var o=AC.createOscillator();o.type=k?'triangle':'sine';o.frequency.value=mf(m.r-12+iv)*(k?1.004:1);o.connect(g);o.start();return o});
  g.connect(f);f.connect(MG);dn.push({g:g,o:os});
 });
}
function note(m){var t=AC.currentTime,s=m.s[Math.random()*m.s.length|0],oc=[12,12,19,24][Math.random()*4|0],o=AC.createOscillator(),g=AC.createGain();

var CK=(function(){
 var s0=function(){return{c:0,tot:0,u:[0,0,0,0,0]}},s=s0(),gt=0,n=0,
 UP=[[["Better shovel","Meilleure pelle"],15,'c',1],[["Stoker","Chauffeur"],60,'a',1],[["Fireman crew","Équipe de chauffe"],350,'a',6],[["Bigger boiler","Chaudière plus grande"],3000,'a',40],[["Express engine","Locomotive express"],20000,'a',250]];
 function cost(i){return Math.floor(UP[i][1]*Math.pow(1.15,s.u[i]))}
 function pc(){return 1+s.u[0]*UP[0][3]}
 function ps(){var a=0;for(var i=1;i<5;i++)a+=s.u[i]*UP[i][3];return a}
 function fmt(x){x=Math.floor(x);if(x<1e3)return''+x;var u=['K','M','B','T'],i=-1;while(x>=1e3&&i<3){x/=1e3;i++}return x.toFixed(x<10?2:x<100?1:0)+u[i]}
 function sv(){ls('mex_ck',JSON.stringify(s))}
 function ui(){
  document.getElementById('ckc').textContent=(lang?'Charbon : ':'Coal: ')+fmt(s.c);
  document.getElementById('cks').textContent=fmt(ps())+'/s  +'+fmt(pc())+(lang?'/clic':'/click');
  document.getElementById('ckm').textContent=(lang?'Total pelleté : ':'Total shoveled: ')+fmt(s.tot);
  for(var i=0;i<5;i++){document.getElementById('kn'+i).textContent='x'+s.u[i];document.getElementById('kc'+i).textContent=fmt(cost(i));document.getElementById('ku'+i).className=s.c<cost(i)?'up no':'up'}}
 function pop(t){var a=document.getElementById('cka'),d=document.createElement('span');d.className='pop';d.textContent=t;d.style.left=(38+Math.random()*24)+'%';a.appendChild(d);setTimeout(function(){d.remove()},900)}
 function click(){var g=pc();s.c+=g;s.tot+=g;pop('+'+fmt(g));ui()}
 function buy(i){var c=cost(i);if(s.c>=c){s.c-=c;s.u[i]++;ui();sv()}}
 function gold(){var a=document.getElementById('cka'),d=document.createElement('button');d.className='gold';d.textContent='✦';d.style.left=(8+Math.random()*80)+'%';d.style.top=(5+Math.random()*60)+'%';
  d.onclick=function(){var b=Math.max(100,ps()*30+pc()*50);s.c+=b;s.tot+=b;pop('+'+fmt(b));d.remove();ui()};a.appendChild(d);setTimeout(function(){d.remove()},7000)}
 function loop(){s.c+=ps()/10;s.tot+=ps()/10;gt-=.1;if(gt<=0){gt=25+Math.random()*25;gold()}if(++n%50==0)sv();ui();TT=setTimeout(loop,100)}

  document.getElementById('cku').innerHTML=h;gt=15+Math.random()*15;n=0;ui();TT=setTimeout(loop,100)}
